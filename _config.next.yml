# NexT theme overrides for Silen1Blog.
# NexT deep-merges this file over themes/next/_config.yml, so only the
# settings that differ from the theme defaults live here. Keep the theme
# folder untouched so NexT can be upgraded by replacing it.
# Docs: https://theme-next.js.org/docs/getting-started/configuration

custom_file_path:
  head: source/_data/head.njk
  postMeta: source/_data/post-meta.njk
  postBodyEnd: source/_data/post-body-end.njk
  footer: source/_data/footer.njk
  bodyEnd: source/_data/body-end.njk
  style: source/_data/styles.styl

scheme: Mist

# Each menu word opens its full page; the home page keeps the same words
# as section headings. 年鉴 (stats) lives on the home page only.
menu:
  札记: /archives/ || fa fa-book
  远征: /learning-paths/ || fa fa-route
  疆域: /categories/ || fa fa-compass

menu_settings:
  icons: false
  badges: false

theme_color:
  light: "#05060b"
  dark: "#05060b"

toc:
  wrap: true
  max_depth: 4

mobile_layout_economy: true

# Justified Chinese and English on a narrow screen stretches the gaps
# between words, so phones read ragged-right.
text_align:
  desktop: justify
  mobile: left

codeblock:
  theme:
    # The site is permanently dark, so both OS modes need a syntax palette
    # designed for a dark code background.
    light: stackoverflow-dark
  prism:
    light: prism-dark
  copy_button:
    enable: true
    style: flat
  language: true

reading_progress:
  enable: true

motion:
  # Avoid hiding the whole page while the external animation runtime loads.
  enable: false

# Share card for links posted to chats and social sites (1200x630).
open_graph:
  options:
    image: /images/og-card.png
    twitter_card: summary_large_image

# The few icons the site uses, as inline SVG (source/css/icons.css), instead
# of the full Font Awesome stylesheet and fonts from a CDN.
vendors:
  fontawesome: /css/icons.css

busuanzi_count:
  enable: true

# Search is provided by the local, dependency-free modal in source/js,
# so NexT's own local_search stays disabled (theme default).
