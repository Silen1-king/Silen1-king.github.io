<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" width="560" height="280" role="img" aria-label="全概率示意图：样本空间被 B1、B2、B3 分成三块，事件 A 横跨三块">
  <defs>
    <clipPath id="e"><ellipse cx="270" cy="118" rx="170" ry="66"/></clipPath>
  </defs>
  <rect width="560" height="280" rx="10" fill="#0c0f19"/>
  <g clip-path="url(#e)" opacity=".16">
    <rect x="24" y="24" width="171" height="232" fill="#7cecff"/>
    <rect x="195" y="24" width="171" height="232" fill="#a88bff"/>
    <rect x="366" y="24" width="170" height="232" fill="#7cecff"/>
  </g>
  <rect x="24" y="24" width="512" height="232" rx="4" fill="none" stroke="#7f88a3" stroke-width="1.5"/>
  <line x1="195" y1="24" x2="195" y2="256" stroke="#7f88a3" stroke-width="1.5"/>
  <line x1="366" y1="24" x2="366" y2="256" stroke="#7f88a3" stroke-width="1.5"/>
  <ellipse cx="270" cy="118" rx="170" ry="66" fill="none" stroke="#ffb067" stroke-width="2"/>
  <g font-family="Georgia, 'Times New Roman', serif" font-style="italic" text-anchor="middle">
    <text x="270" y="100" fill="#ffb067" font-size="30">A</text>
    <g fill="#e7eaf4" font-size="26">
      <text x="100" y="232">B<tspan font-size="16" dy="6">1</tspan></text>
      <text x="280" y="232">B<tspan font-size="16" dy="6">2</tspan></text>
      <text x="451" y="232">B<tspan font-size="16" dy="6">3</tspan></text>
    </g>
    <g fill="#cfd4e3" font-size="16">
      <text x="160" y="146">AB<tspan font-size="11" dy="4">1</tspan></text>
      <text x="280" y="146">AB<tspan font-size="11" dy="4">2</tspan></text>
      <text x="396" y="146">AB<tspan font-size="11" dy="4">3</tspan></text>
    </g>
  </g>
</svg>
