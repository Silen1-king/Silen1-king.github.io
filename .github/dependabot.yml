version: 2
updates:
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  groups:
    npm-dependencies:
      patterns:
        - "*"
# Workflow actions are pinned to commit SHAs; Dependabot bumps the SHA and
# the version comment together.
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
